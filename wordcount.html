<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>字数统计 - 元强工具箱</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f6f8fa; color: #24292f; line-height: 1.6; padding: 20px; min-height: 100vh; }
  .container { max-width: 700px; margin: 0 auto; }
  .topbar { margin-bottom: 20px; }
  .topbar a { color: #0969da; text-decoration: none; font-size: 14px; }
  h1 { font-size: 22px; margin-bottom: 20px; }
  .card { background: #fff; border: 1px solid #d0d7de; border-radius: 8px; padding: 20px; margin-bottom: 16px; }
  textarea { width: 100%; height: 250px; padding: 12px; border: 1px solid #d0d7de; border-radius: 6px; font-size: 14px; resize: vertical; font-family: inherit; }
  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-top: 16px; }
  .stat-item { background: #f6f8fa; padding: 12px; border-radius: 6px; text-align: center; }
  .stat-num { font-size: 24px; font-weight: 600; color: #0969da; }
  .stat-label { font-size: 12px; color: #57606a; margin-top: 4px; }
</style>
</head>
<body>
<div class="container">
  <div class="topbar"><a href="index.html">← 返回工具箱</a></div>
  <h1>📝 字数统计</h1>

  <div class="card">
    <textarea id="text" placeholder="粘贴或输入文本，自动统计..." oninput="count()"></textarea>
    <div class="stats">
      <div class="stat-item">
        <div class="stat-num" id="chars">0</div>
        <div class="stat-label">总字符数</div>
      </div>
      <div class="stat-item">
        <div class="stat-num" id="words">0</div>
        <div class="stat-label">单词/词数</div>
      </div>
      <div class="stat-item">
        <div class="stat-num" id="lines">0</div>
        <div class="stat-label">行数</div>
      </div>
      <div class="stat-item">
        <div class="stat-num" id="chinese">0</div>
        <div class="stat-label">中文字</div>
      </div>
      <div class="stat-item">
        <div class="stat-num" id="digits">0</div>
        <div class="stat-label">数字</div>
      </div>
      <div class="stat-item">
        <div class="stat-num" id="spaces">0</div>
        <div class="stat-label">空格</div>
      </div>
      <div class="stat-item">
        <div class="stat-num" id="bytes">0</div>
        <div class="stat-label">字节 (UTF-8)</div>
      </div>
      <div class="stat-item">
        <div class="stat-num" id="tokens">0</div>
        <div class="stat-label">≈ Token 估算</div>
      </div>
    </div>
  </div>
</div>

<script>
function count() {
  const text = document.getElementById('text').value;
  document.getElementById('chars').textContent = text.length;
  document.getElementById('words').textContent = text.trim() ? text.trim().split(/\s+/).length : 0;
  document.getElementById('lines').textContent = text ? text.split('\n').length : 0;
  document.getElementById('chinese').textContent = (text.match(/[\u4e00-\u9fa5]/g) || []).length;
  document.getElementById('digits').textContent = (text.match(/\d/g) || []).length;
  document.getElementById('spaces').textContent = (text.match(/ /g) || []).length;

  // UTF-8 字节数：中文 3 字节，其他 1 字节
  const chineseCount = (text.match(/[\u4e00-\u9fa5]/g) || []).length;
  const otherCount = text.length - chineseCount;
  const bytes = chineseCount * 3 + otherCount;
  document.getElementById('bytes').textContent = bytes;

  // Token 估算：中文约 1.5 字 = 1 token，英文约 4 字符 = 1 token
  const enChars = text.replace(/[\u4e00-\u9fa5]/g, '').length;
  const tokens = Math.round(chineseCount / 1.5 + enChars / 4);
  document.getElementById('tokens').textContent = tokens;
}
</script>
</body>
</html>
