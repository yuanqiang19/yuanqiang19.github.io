<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IP 地址查询 - 元强工具箱</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f6f8fa; color: #24292f; line-height: 1.6; padding: 20px; min-height: 100vh; }
  .container { max-width: 600px; margin: 0 auto; }
  .topbar { margin-bottom: 20px; }
  .topbar a { color: #0969da; text-decoration: none; font-size: 14px; }
  h1 { font-size: 22px; margin-bottom: 20px; }
  .card { background: #fff; border: 1px solid #d0d7de; border-radius: 8px; padding: 20px; }
  .row { display: flex; gap: 8px; margin-bottom: 16px; }
  input[type=text] { flex: 1; padding: 9px 12px; border: 1px solid #d0d7de; border-radius: 6px; font-size: 14px; outline: none; }
  input[type=text]:focus { border-color: #0969da; }
  button { padding: 9px 20px; background: #1f883d; color: #fff; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; }
  button:hover { background: #1a7f37; }
  .loading { text-align: center; padding: 30px; color: #57606a; }
  .result { display: none; }
  .result.show { display: block; }
  .ip-big { text-align: center; padding: 20px; background: #f6f8fa; border-radius: 8px; margin-bottom: 16px; }
  .ip-big .ip { font-size: 32px; font-weight: 600; color: #0969da; }
  .info-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #d0d7de; font-size: 14px; }
  .info-row:last-child { border-bottom: none; }
  .info-row .label { color: #57606a; }
  .info-row .value { font-weight: 500; }
  .error { margin-top: 12px; padding: 12px; background: #ffebe9; color: #cf222e; border-radius: 6px; font-size: 14px; display: none; }
  .error.show { display: block; }
</style>
</head>
<body>
<div class="container">
  <div class="topbar"><a href="index.html">← 返回工具箱</a></div>
  <h1>🌍 IP 地址查询</h1>
  <div class="card">
    <div class="row">
      <input type="text" id="ipInput" placeholder="输入 IP 查询，留空查当前 IP">
      <button onclick="query()">查询</button>
    </div>
    <div class="loading" id="loading">加载中...</div>
    <div class="error" id="error"></div>
    <div class="result" id="result">
      <div class="ip-big"><div class="ip" id="ip">-</div></div>
      <div class="info-row"><span class="label">归属地</span><span class="value" id="addr">-</span></div>
    </div>
  </div>
</div>
<script>
// JSONP 回调函数，太平洋 API 返回时自动调用
window.ipJson = function(data) {
  document.getElementById('loading').style.display = 'none';
  if (!data || data.err) {
    var e = document.getElementById('error');
    e.textContent = '查询失败：' + (data && data.err ? data.err : '未知错误');
    e.classList.add('show');
    return;
  }
  document.getElementById('ip').textContent = data.ip;
  document.getElementById('addr').textContent = data.addr || '-';
  document.getElementById('result').classList.add('show');
  // 清理 script 标签
  if (window._ipScript) {
    document.body.removeChild(window._ipScript);
    window._ipScript = null;
  }
};

function query() {
  var ip = document.getElementById('ipInput').value.trim();
  document.getElementById('loading').style.display = 'block';
  document.getElementById('result').classList.remove('show');
  document.getElementById('error').classList.remove('show');

  // 清理旧的 script
  if (window._ipScript) document.body.removeChild(window._ipScript);

  var script = document.createElement('script');
  script.src = 'https://whois.pconline.com.cn/ipJson.jsp?json=true' + (ip ? '&ip=' + ip : '');
  script.onerror = function() {
    document.getElementById('loading').style.display = 'none';
    var e = document.getElementById('error');
    e.textContent = '查询失败：网络超时，请稍后重试';
    e.classList.add('show');
  };
  document.body.appendChild(script);
  window._ipScript = script;
}

window.onload = query;
</script>
</body>
</html>
