<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个税计算器 - 元强工具箱</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f6f8fa; color: #24292f; line-height: 1.6; padding: 20px; min-height: 100vh; }
  .container { max-width: 600px; margin: 0 auto; }
  .topbar { margin-bottom: 20px; }
  .topbar a { color: #0969da; text-decoration: none; font-size: 14px; }
  h1 { font-size: 22px; margin-bottom: 20px; }
  .card { background: #fff; border: 1px solid #d0d7de; border-radius: 8px; padding: 20px; margin-bottom: 16px; }
  .card h2 { font-size: 16px; margin-bottom: 16px; }
  .row { margin-bottom: 12px; }
  .row label { display: block; font-size: 13px; color: #57606a; margin-bottom: 4px; }
  .row input, .row select { width: 100%; padding: 8px 12px; border: 1px solid #d0d7de; border-radius: 6px; font-size: 14px; }
  button { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; background: #2da44e; color: #fff; width: 100%; margin-top: 10px; }
  button:hover { opacity: 0.9; }
  .result { background: #f6f8fa; padding: 16px; border-radius: 8px; margin-top: 16px; }
  .result-row { display: flex; justify-content: space-between; padding: 6px 0; font-size: 14px; }
  .result-row.highlight { font-size: 18px; font-weight: 600; color: #2da44e; border-top: 1px solid #d0d7de; margin-top: 8px; padding-top: 12px; }
  .presets { margin-top: 12px; font-size: 12px; color: #57606a; }
  .presets button { width: auto; padding: 4px 10px; font-size: 12px; background: #f6f8fa; color: #24292f; border: 1px solid #d0d7de; margin: 2px; }
  .tabs { display: flex; gap: 0; margin-bottom: 16px; border-bottom: 2px solid #d0d7de; }
  .tab { padding: 8px 16px; cursor: pointer; font-size: 14px; color: #57606a; border-bottom: 2px solid transparent; margin-bottom: -2px; }
  .tab.active { color: #0969da; border-bottom-color: #0969da; }
</style>
</head>
<body>
<div class="container">
  <div class="topbar"><a href="index.html">← 返回工具箱</a></div>
  <h1>💰 个税计算器</h1>

  <div class="card">
    <div class="tabs">
      <div class="tab active" onclick="switchTab('monthly', this)">月薪计算</div>
      <div class="tab" onclick="switchTab('bonus', this)">年终奖计算</div>
    </div>

    <!-- 月薪计算 -->
    <div id="monthlyTab">
      <div class="row">
        <label>税前月薪（元）</label>
        <input type="number" id="salary" placeholder="比如：10000" value="10000">
      </div>
      <div class="row">
        <label>所在城市（自动算五险一金比例）</label>
        <select id="city">
          <option value="default">默认（个人10.5%）</option>
          <option value="beijing">北京（个人10.2%+3）</option>
          <option value="shanghai">上海（个人10.5%）</option>
          <option value="shenzhen">深圳（个人10%）</option>
          <option value="sichuan">四川（个人10.5%）</option>
        </select>
      </div>
      <div class="row">
        <label>专项附加扣除（元/月）</label>
        <input type="number" id="special" placeholder="租房1500/房贷1000/赡养老人2000" value="0">
      </div>
      <div class="row">
        <label>专项附加扣除项（勾选自动填）</label>
        <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:4px;font-size:13px;">
          <label><input type="checkbox" value="1500" onchange="updateSpecial()"> 租房(1500)</label>
          <label><input type="checkbox" value="1000" onchange="updateSpecial()"> 房贷(1000)</label>
          <label><input type="checkbox" value="2000" onchange="updateSpecial()"> 赡养老人(2000)</label>
          <label><input type="checkbox" value="1000" onchange="updateSpecial()"> 子女教育(1000)</label>
          <label><input type="checkbox" value="400" onchange="updateSpecial()"> 继续教育(400)</label>
        </div>
      </div>

      <button onclick="calcMonthly()">计算</button>

      <div class="presets">
        快速填入：
        <button onclick="fill(5000, 'default', 0)">月薪5千</button>
        <button onclick="fill(10000, 'default', 1500)">月薪1万+租房</button>
        <button onclick="fill(20000, 'default', 2000)">月薪2万+赡养老人</button>
        <button onclick="fill(50000, 'default', 3000)">月薪5万</button>
      </div>

      <div class="result" id="result" style="display:none;"></div>
    </div>

    <!-- 年终奖计算 -->
    <div id="bonusTab" style="display:none;">
      <div class="row">
        <label>年终奖金额（元）</label>
        <input type="number" id="bonus" placeholder="比如：20000" value="20000">
      </div>
      <div class="row">
        <label>当月工资（元，判断是否够起征点）</label>
        <input type="number" id="monthlySalary" placeholder="比如：10000" value="10000">
      </div>

      <button onclick="calcBonus()">计算</button>
      <div class="result" id="bonusResult" style="display:none;"></div>
    </div>
  </div>
</div>

<script>
let currentTab = 'monthly';

function switchTab(tab, el) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('monthlyTab').style.display = tab === 'monthly' ? 'block' : 'none';
  document.getElementById('bonusTab').style.display = tab === 'bonus' ? 'block' : 'none';
}

function updateSpecial() {
  let total = 0;
  document.querySelectorAll('#monthlyTab input[type=checkbox]').forEach(cb => {
    if (cb.checked) total += parseInt(cb.value);
  });
  document.getElementById('special').value = total;
}

function fill(salary, city, special) {
  document.getElementById('salary').value = salary;
  document.getElementById('city').value = city;
  document.getElementById('special').value = special;
  calcMonthly();
}

function calcMonthly() {
  const salary = parseFloat(document.getElementById('salary').value) || 0;
  const city = document.getElementById('city').value;
  const special = parseFloat(document.getElementById('special').value) || 0;

  // 五险一金比例（个人部分）
  let socialRate = 0.105; // 默认10.5%
  let fixedDeduct = 0;
  if (city === 'beijing') { socialRate = 0.102; fixedDeduct = 3; }
  else if (city === 'shanghai') { socialRate = 0.105; }
  else if (city === 'shenzhen') { socialRate = 0.10; }
  else if (city === 'sichuan') { socialRate = 0.105; }

  const social = salary * socialRate + fixedDeduct;
  const threshold = 5000;

  // 应纳税所得额
  const taxable = Math.max(0, salary - social - special - threshold);

  // 税率表（按月）
  let rate = 0, quickDeduct = 0;
  if (taxable <= 3000) { rate = 0.03; quickDeduct = 0; }
  else if (taxable <= 12000) { rate = 0.10; quickDeduct = 210; }
  else if (taxable <= 25000) { rate = 0.20; quickDeduct = 1410; }
  else if (taxable <= 35000) { rate = 0.25; quickDeduct = 2660; }
  else if (taxable <= 55000) { rate = 0.30; quickDeduct = 4410; }
  else if (taxable <= 80000) { rate = 0.35; quickDeduct = 7160; }
  else { rate = 0.45; quickDeduct = 15160; }

  const tax = taxable * rate - quickDeduct;
  const afterTax = salary - social - tax;

  document.getElementById('result').style.display = 'block';
  document.getElementById('result').innerHTML = `
    <div class="result-row"><span>税前工资</span><span>¥ ${salary.toFixed(2)}</span></div>
    <div class="result-row"><span>五险一金（${(socialRate*100).toFixed(1)}%+${fixedDeduct}）</span><span>- ¥ ${social.toFixed(2)}</span></div>
    <div class="result-row"><span>专项附加扣除</span><span>- ¥ ${special.toFixed(2)}</span></div>
    <div class="result-row"><span>起征点</span><span>- ¥ ${threshold}</span></div>
    <div class="result-row"><span>应纳税所得额</span><span>¥ ${taxable.toFixed(2)}</span></div>
    <div class="result-row"><span>适用税率</span><span>${(rate*100).toFixed(0)}% （速算扣除 ${quickDeduct}）</span></div>
    <div class="result-row"><span>个人所得税</span><span style="color:#cf222e">- ¥ ${tax.toFixed(2)}</span></div>
    <div class="result-row highlight"><span>税后到手</span><span>¥ ${afterTax.toFixed(2)}</span></div>
    <div class="result-row"><span>实际到手比例</span><span>${(afterTax/salary*100).toFixed(1)}%</span></div>
  `;
}

function calcBonus() {
  const bonus = parseFloat(document.getElementById('bonus').value) || 0;
  const monthlySalary = parseFloat(document.getElementById('monthlySalary').value) || 0;

  // 年终奖计税：单独计税
  const monthlyTaxable = bonus / 12;
  let rate = 0, quickDeduct = 0;
  if (monthlyTaxable <= 3000) { rate = 0.03; quickDeduct = 0; }
  else if (monthlyTaxable <= 12000) { rate = 0.10; quickDeduct = 210; }
  else if (monthlyTaxable <= 25000) { rate = 0.20; quickDeduct = 1410; }
  else if (monthlyTaxable <= 35000) { rate = 0.25; quickDeduct = 2660; }
  else if (monthlyTaxable <= 55000) { rate = 0.30; quickDeduct = 4410; }
  else if (monthlyTaxable <= 80000) { rate = 0.35; quickDeduct = 7160; }
  else { rate = 0.45; quickDeduct = 15160; }

  const tax = bonus * rate - quickDeduct;
  const afterTax = bonus - tax;

  document.getElementById('bonusResult').style.display = 'block';
  document.getElementById('bonusResult').innerHTML = `
    <div class="result-row"><span>年终奖金额</span><span>¥ ${bonus.toFixed(2)}</span></div>
    <div class="result-row"><span>月均（${(bonus/12).toFixed(0)}元）适用税率</span><span>${(rate*100).toFixed(0)}%</span></div>
    <div class="result-row"><span>年终奖个税</span><span style="color:#cf222e">- ¥ ${tax.toFixed(2)}</span></div>
    <div class="result-row highlight"><span>税后到手</span><span>¥ ${afterTax.toFixed(2)}</span></div>
    <div class="result-row"><span>到手比例</span><span>${(afterTax/bonus*100).toFixed(1)}%</span></div>
  `;
}

calcMonthly();
</script>
</body>
</html>
