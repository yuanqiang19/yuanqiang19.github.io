<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>浏览器信息检测 - 元强工具箱</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f6f8fa; color: #24292f; line-height: 1.6; padding: 20px; min-height: 100vh; }
  .container { max-width: 600px; margin: 0 auto; }
  .topbar { margin-bottom: 20px; }
  .topbar a { color: #0969da; text-decoration: none; font-size: 14px; }
  h1 { font-size: 22px; margin-bottom: 20px; }
  .card { background: #fff; border: 1px solid #d0d7de; border-radius: 8px; padding: 20px; margin-bottom: 16px; }
  .card h2 { font-size: 14px; color: #57606a; margin-bottom: 12px; text-transform: uppercase; }
  .info-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #d0d7de; font-size: 14px; }
  .info-row:last-child { border-bottom: none; }
  .info-row .label { color: #57606a; }
  .info-row .value { font-weight: 500; text-align: right; word-break: break-all; max-width: 70%; }
  .ua-box { background: #f6f8fa; padding: 12px; border-radius: 6px; font-family: Consolas, monospace; font-size: 12px; word-break: break-all; }
</style>
</head>
<body>
<div class="container">
  <div class="topbar"><a href="index.html">← 返回工具箱</a></div>
  <h1>🔍 浏览器信息检测</h1>

  <div class="card">
    <h2>基本信息</h2>
    <div class="info-row"><span class="label">浏览器</span><span class="value" id="browser">-</span></div>
    <div class="info-row"><span class="label">操作系统</span><span class="value" id="os">-</span></div>
    <div class="info-row"><span class="label">屏幕分辨率</span><span class="value" id="screen">-</span></div>
    <div class="info-row"><span class="label">窗口大小</span><span class="value" id="window">-</span></div>
    <div class="info-row"><span class="label">时区</span><span class="value" id="timezone">-</span></div>
    <div class="info-row"><span class="label">语言</span><span class="value" id="lang">-</span></div>
    <div class="info-row"><span class="label">在线状态</span><span class="value" id="online">-</span></div>
    <div class="info-row"><span class="label">Cookie 启用</span><span class="value" id="cookie">-</span></div>
  </div>

  <div class="card">
    <h2>User-Agent 完整字符串</h2>
    <div class="ua-box" id="ua">-</div>
  </div>
</div>

<script>
var ua = navigator.userAgent;

// 识别浏览器（先识别内置 App，再识别主流浏览器）
var browser = '未知';
if (ua.indexOf('DingTalk') > -1 || ua.indexOf('AliApp') > -1) browser = '钉钉内置浏览器';
else if (ua.indexOf('MicroMessenger') > -1) browser = '微信内置浏览器';
else if (ua.indexOf('QQ/') > -1 || ua.indexOf('QQBrowser') > -1) browser = 'QQ浏览器';
else if (ua.indexOf('WeiBo') > -1) browser = '微博内置浏览器';
else if (ua.indexOf('Edg') > -1) browser = 'Edge';
else if (ua.indexOf('Chrome') > -1 && ua.indexOf('Safari') > -1) browser = 'Chrome';
else if (ua.indexOf('Firefox') > -1) browser = 'Firefox';
else if (ua.indexOf('Safari') > -1 || ua.indexOf('AppleWebKit') > -1) browser = 'Safari';
document.getElementById('browser').textContent = browser;

// 识别操作系统（手机优先，再判断桌面）
var os = '未知';
if (ua.indexOf('iPhone') > -1) {
  // 苹果UA里 iPhone OS 后面的版本号已被冻结，真实版本号在 Version/ 后面
  var iosMatch = ua.match(/Version\/(\d+\.\d+)/);
  os = iosMatch ? 'iPhone iOS ' + iosMatch[1] : 'iPhone';
}
else if (ua.indexOf('iPad') > -1) {
  var ipadMatch = ua.match(/Version\/(\d+\.\d+)/);
  os = ipadMatch ? 'iPad iOS ' + ipadMatch[1] : 'iPad';
}
else if (ua.indexOf('Android') > -1) {
  var androidMatch = ua.match(/Android (\d+\.?\d*)/);
  os = androidMatch ? 'Android ' + androidMatch[1] : 'Android';
}
else if (ua.indexOf('Windows NT 10.0') > -1) os = 'Windows 10/11';
else if (ua.indexOf('Windows NT 6.3') > -1) os = 'Windows 8.1';
else if (ua.indexOf('Windows NT 6.1') > -1) os = 'Windows 7';
else if (ua.indexOf('Mac OS X') > -1) os = 'macOS';
else if (ua.indexOf('Linux') > -1) os = 'Linux';
document.getElementById('os').textContent = os;

var dpr = window.devicePixelRatio || 1;
document.getElementById('screen').textContent = screen.width + ' × ' + screen.height + '（@' + dpr + 'x）';
document.getElementById('window').textContent = innerWidth + ' × ' + innerHeight;
document.getElementById('timezone').textContent = Intl.DateTimeFormat().resolvedOptions().timeZone;
document.getElementById('lang').textContent = navigator.language;
document.getElementById('online').textContent = navigator.onLine ? '✅ 在线' : '❌ 离线';
document.getElementById('cookie').textContent = navigator.cookieEnabled ? '✅ 已启用' : '❌ 未启用';
document.getElementById('ua').textContent = ua;
</script>
</body>
</html>
