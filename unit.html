<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>单位换算 - 元强工具箱</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f6f8fa; color: #24292f; line-height: 1.6; padding: 20px; min-height: 100vh; }
  .container { max-width: 720px; margin: 0 auto; }
  .topbar { margin-bottom: 20px; }
  .topbar a { color: #0969da; text-decoration: none; font-size: 14px; }
  h1 { font-size: 22px; margin-bottom: 20px; }
  .card { background: #fff; border: 1px solid #d0d7de; border-radius: 8px; padding: 20px; margin-bottom: 16px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 16px; }
  .tab { padding: 6px 14px; border: 1px solid #d0d7de; border-radius: 6px; cursor: pointer; font-size: 13px; background: #f6f8fa; }
  .tab.active { background: #1f883d; color: #fff; border-color: #1f883d; }
  .row { display: flex; gap: 10px; margin-bottom: 12px; align-items: center; flex-wrap: wrap; }
  input, select { padding: 8px 12px; border: 1px solid #d0d7de; border-radius: 6px; font-size: 14px; outline: none; }
  input:focus, select:focus { border-color: #0969da; }
  input[type=number] { width: 140px; }
  .result { margin-top: 16px; padding: 14px; background: #f6f8fa; border-radius: 6px; font-size: 15px; }
  .result b { color: #0969da; font-size: 18px; }
</style>
</head>
<body>
<div class="container">
  <div class="topbar"><a href="index.html">← 返回工具箱</a></div>
  <h1>📏 单位换算</h1>

  <div class="card">
    <div class="tabs">
      <div class="tab active" onclick="switchTab('length', this)">长度</div>
      <div class="tab" onclick="switchTab('weight', this)">重量</div>
      <div class="tab" onclick="switchTab('temp', this)">温度</div>
      <div class="tab" onclick="switchTab('area', this)">面积</div>
      <div class="tab" onclick="switchTab('time', this)">时间</div>
      <div class="tab" onclick="switchTab('data', this)">数据存储</div>
    </div>

    <div class="row">
      <input type="number" id="inputVal" placeholder="数值" oninput="convert()" value="1">
      <select id="fromUnit" onchange="convert()"></select>
      <span>→</span>
      <select id="toUnit" onchange="convert()"></select>
    </div>
    <div style="margin-bottom:12px;font-size:12px;color:#57606a;">常用：
      <button class="secondary" onclick="quick(100,'厘米 cm','米 m')">100厘米=?米</button>
      <button class="secondary" onclick="quick(1,'千米','英里')">1公里=?英里</button>
      <button class="secondary" onclick="quick(1,'千克 kg','磅 lb')">1公斤=?磅</button>
      <button class="secondary" onclick="quick(100,'摄氏 °C','华氏 °F')">100°C=?°F</button>
    </div>
    <div class="result" id="result"></div>
  </div>

  <div class="card">
    <h2 style="font-size:16px;margin-bottom:12px;">💬 大白话换算</h2>
    <input type="text" id="descUnit" placeholder="比如：100厘米等于多少米 / 1公里是多少英里 / 100华氏度是多少摄氏度" style="margin-bottom:10px;">
    <button onclick="descConvert()">换算</button>
    <div class="result" id="descResult" style="display:none;"></div>
  </div>
</div>

<script>
const data = {
  length: {
    units: { '毫米 mm': 0.001, '厘米 cm': 0.01, '米 m': 1, '千米 km': 1000, '英寸 in': 0.0254, '英尺 ft': 0.3048, '英里 mile': 1609.344 },
    base: '米 m'
  },
  weight: {
    units: { '毫克 mg': 0.000001, '克 g': 0.001, '千克 kg': 1, '吨 t': 1000, '盎司 oz': 0.0283495, '磅 lb': 0.453592 },
    base: '千克 kg'
  },
  temp: { units: { '摄氏 °C': 'c', '华氏 °F': 'f', '开尔文 K': 'k' }, base: '摄氏 °C' },
  area: {
    units: { '平方厘米 cm²': 0.0001, '平方米 m²': 1, '平方千米 km²': 1000000, '公顷 ha': 10000, '亩': 666.67, '平方英尺 ft²': 0.0929, '英亩 acre': 4046.86 },
    base: '平方米 m²'
  },
  time: {
    units: { '毫秒 ms': 0.001, '秒 s': 1, '分钟 min': 60, '小时 h': 3600, '天 day': 86400, '周 week': 604800, '月(30天) month': 2592000, '年(365天) year': 31536000 },
    base: '秒 s'
  },
  data: {
    units: { '字节 B': 1, 'KB': 1024, 'MB': 1024*1024, 'GB': 1024*1024*1024, 'TB': 1024*1024*1024*1024 },
    base: '字节 B'
  }
};
let currentTab = 'length';

function switchTab(tab, el) {
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  fillUnits();
  convert();
}

function fillUnits() {
  const d = data[currentTab];
  const from = document.getElementById('fromUnit');
  const to = document.getElementById('toUnit');
  from.innerHTML = to.innerHTML = '';
  Object.keys(d.units).forEach(u => {
    from.innerHTML += `<option>${u}</option>`;
    to.innerHTML += `<option>${u}</option>`;
  });
  to.selectedIndex = 2;
}

function convert() {
  const val = parseFloat(document.getElementById('inputVal').value);
  if (isNaN(val)) { document.getElementById('result').innerHTML = '请输入数值'; return; }
  const from = document.getElementById('fromUnit').value;
  const to = document.getElementById('toUnit').value;
  let result;
  if (currentTab === 'temp') {
    let c;
    if (from.includes('°C')) c = val;
    else if (from.includes('°F')) c = (val - 32) * 5 / 9;
    else c = val - 273.15;
    if (to.includes('°C')) result = c;
    else if (to.includes('°F')) result = c * 9 / 5 + 32;
    else result = c + 273.15;
  } else {
    const d = data[currentTab];
    result = val * d.units[from] / d.units[to];
  }
  document.getElementById('result').innerHTML =
    `${val} ${from} = <b>${parseFloat(result.toFixed(6))}</b> ${to}`;
}

// 大白话换算
function descConvert() {
  const text = document.getElementById('descUnit').value.trim();
  if (!text) return;

  // 提取数字
  const numMatch = text.match(/(\d+\.?\d*)/);
  if (!numMatch) return;
  const val = parseFloat(numMatch[1]);

  // 单位映射
  const unitMap = {
    '毫米': '毫米 mm', 'cm': '厘米 cm', '厘米': '厘米 cm',
    '米': '米 m', '公里': '千米 km', '千米': '千米 km',
    '英寸': '英寸 in', '英尺': '英尺 ft', '英里': '英里 mile',
    '克': '克 g', '千克': '千克 kg', '公斤': '千克 kg',
    '吨': '吨 t', '磅': '磅 lb', '盎司': '盎司 oz',
    '摄氏度': '摄氏 °C', '度': '摄氏 °C', '℃': '摄氏 °C',
    '华氏度': '华氏 °F', '℉': '华氏 °F'
  };

  // 找两个单位
  const found = [];
  for (const [key, unitName] of Object.entries(unitMap)) {
    if (text.includes(key)) found.push(unitName);
  }

  if (found.length < 2) {
    document.getElementById('descResult').style.display = 'block';
    document.getElementById('descResult').innerHTML = '没识别到两个单位，试试写：100厘米=?米';
    return;
  }

  const from = found[0];
  const to = found[1];

  // 判断是长度/重量/温度
  let tab = 'length';
  if (from.includes('kg') || from.includes('克') || from.includes('磅') || from.includes('吨')) tab = 'weight';
  if (from.includes('°C') || from.includes('°F')) tab = 'temp';

  // 切换 tab
  currentTab = tab;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelector('.tab:nth-child(' + (tab === 'length' ? 1 : tab === 'weight' ? 2 : 3) + ')').classList.add('active');
  fillUnits();

  document.getElementById('inputVal').value = val;
  document.getElementById('fromUnit').value = from;
  document.getElementById('toUnit').value = to;
  convert();

  // 把结果复制到大话话区域
  document.getElementById('descResult').style.display = 'block';
  document.getElementById('descResult').innerHTML = document.getElementById('result').innerHTML;
}

function quick(val, from, to) {
  document.getElementById('inputVal').value = val;
  document.getElementById('fromUnit').value = from;
  document.getElementById('toUnit').value = to;
  convert();
}

fillUnits();
convert();
</script>
</body>
</html>
