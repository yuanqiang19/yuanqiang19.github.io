<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>密码生成器 - 元强工具箱</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f6f8fa; color: #24292f; line-height: 1.6; padding: 20px; min-height: 100vh; }
  .container { max-width: 600px; margin: 0 auto; }
  .topbar { margin-bottom: 20px; }
  .topbar a { color: #0969da; text-decoration: none; font-size: 14px; }
  h1 { font-size: 22px; margin-bottom: 20px; }
  .card { background: #fff; border: 1px solid #d0d7de; border-radius: 8px; padding: 20px; margin-bottom: 16px; }
  .result-box { background: #f6f8fa; padding: 16px; border-radius: 8px; font-family: Consolas, monospace; font-size: 20px; text-align: center; margin: 16px 0; word-break: break-all; }
  .row { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #d0d7de; font-size: 14px; }
  .row:last-child { border-bottom: none; }
  input[type=range] { width: 200px; }
  input[type=checkbox] { width: 18px; height: 18px; }
  button { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; background: #2da44e; color: #fff; width: 100%; margin-top: 10px; }
  button:hover { opacity: 0.9; }
  button.secondary { background: #f6f8fa; color: #24292f; border: 1px solid #d0d7de; }
  .strength { font-size: 13px; margin-top: 8px; text-align: center; }
</style>
</head>
<body>
<div class="container">
  <div class="topbar"><a href="index.html">← 返回工具箱</a></div>
  <h1>🔐 密码生成器</h1>

  <div class="card">
    <div class="result-box" id="result">-</div>
    <div class="strength" id="strength"></div>

    <div class="row">
      <span>密码长度</span>
      <span><input type="range" id="length" min="6" max="32" value="16" oninput="gen()"> <span id="lenVal">16</span></span>
    </div>
    <div class="row">
      <span>包含大写字母 (A-Z)</span>
      <input type="checkbox" id="upper" checked onchange="gen()">
    </div>
    <div class="row">
      <span>包含小写字母 (a-z)</span>
      <input type="checkbox" id="lower" checked onchange="gen()">
    </div>
    <div class="row">
      <span>包含数字 (0-9)</span>
      <input type="checkbox" id="number" checked onchange="gen()">
    </div>
    <div class="row">
      <span>包含特殊符号 (!@#$%)</span>
      <input type="checkbox" id="symbol" checked onchange="gen()">
    </div>
    <div class="row">
      <span>排除易混淆字符 (0O1lI)</span>
      <input type="checkbox" id="exclude" onchange="gen()">
    </div>

    <button onclick="gen()">🔄 重新生成</button>
    <button class="secondary" onclick="copyPwd()">📋 复制密码</button>
  </div>
</div>

<script>
function gen() {
  const len = parseInt(document.getElementById('length').value);
  document.getElementById('lenVal').textContent = len;

  let chars = '';
  if (document.getElementById('upper').checked) chars += 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  if (document.getElementById('lower').checked) chars += 'abcdefghijklmnopqrstuvwxyz';
  if (document.getElementById('number').checked) chars += '0123456789';
  if (document.getElementById('symbol').checked) chars += '!@#$%^&*()_+-=[]{}|;:,.<>?';

  if (document.getElementById('exclude').checked) {
    chars = chars.replace(/[0O1lI]/g, '');
  }

  if (!chars) {
    document.getElementById('result').textContent = '请至少勾选一项';
    document.getElementById('strength').textContent = '';
    return;
  }

  let pwd = '';
  for (let i = 0; i < len; i++) {
    pwd += chars[Math.floor(Math.random() * chars.length)];
  }

  document.getElementById('result').textContent = pwd;

  // 强度评估
  let score = 0;
  if (len >= 12) score++;
  if (len >= 16) score++;
  if (document.getElementById('upper').checked) score++;
  if (document.getElementById('number').checked) score++;
  if (document.getElementById('symbol').checked) score++;

  const el = document.getElementById('strength');
  if (score <= 2) { el.innerHTML = '强度：<span style="color:#cf222e">弱</span>'; }
  else if (score <= 4) { el.innerHTML = '强度：<span style="color:#bf8700">中</span>'; }
  else { el.innerHTML = '强度：<span style="color:#2da44e">强</span>'; }
}

function copyPwd() {
  const pwd = document.getElementById('result').textContent;
  if (pwd === '-') return;
  navigator.clipboard.writeText(pwd).then(() => alert('密码已复制到剪贴板'));
}

gen();
</script>
</body>
</html>
