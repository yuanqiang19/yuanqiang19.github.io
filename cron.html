<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cron 表达式 - 元强工具箱</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f6f8fa; color: #24292f; line-height: 1.6; padding: 20px; min-height: 100vh; }
  .container { max-width: 700px; margin: 0 auto; }
  .topbar { margin-bottom: 20px; }
  .topbar a { color: #0969da; text-decoration: none; font-size: 14px; }
  h1 { font-size: 22px; margin-bottom: 20px; }
  .card { background: #fff; border: 1px solid #d0d7de; border-radius: 8px; padding: 20px; margin-bottom: 16px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; color: #57606a; margin-bottom: 4px; }
  input[type=text] { width: 100%; padding: 10px 12px; border: 1px solid #d0d7de; border-radius: 6px; font-family: Consolas, monospace; font-size: 15px; outline: none; }
  input[type=text]:focus { border-color: #0969da; }
  button { padding: 10px 20px; background: #1f883d; color: #fff; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; }
  button:hover { background: #1a7f37; }
  .desc-box { padding: 14px; background: #f6f8fa; border-radius: 6px; margin-top: 14px; font-size: 14px; }
  .desc-box .label { font-size: 12px; color: #57606a; margin-bottom: 4px; }
  .preset { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .preset button { background: #f6f8fa; color: #24292f; border: 1px solid #d0d7de; font-size: 12px; padding: 5px 10px; }
  .preset button:hover { background: #eef1f4; }
  table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13px; }
  th, td { padding: 6px 10px; text-align: left; border-bottom: 1px solid #d0d7de; }
  th { color: #57606a; font-weight: 600; }
</style>
</head>
<body>
<div class="container">
  <div class="topbar"><a href="index.html">← 返回工具箱</a></div>
  <h1>⌛ Cron 表达式</h1>

  <div class="card">
    <div class="field">
      <label>Cron 表达式（分 时 日 月 周）</label>
      <input type="text" id="cron" value="30 2 * * *">
    </div>
    <button onclick="parse()">解析</button>
    <div class="preset">
      <button onclick="setCron('* * * * *')">每分钟</button>
      <button onclick="setCron('*/5 * * * *')">每5分钟</button>
      <button onclick="setCron('0 * * * *')">每小时整点</button>
      <button onclick="setCron('0 0 * * *')">每天零点</button>
      <button onclick="setCron('0 12 * * *')">每天中午12点</button>
      <button onclick="setCron('30 2 * * *')">每天凌晨2:30</button>
      <button onclick="setCron('0 9 * * 1-5')">工作日早9点</button>
      <button onclick="setCron('0 18 * * 5')">每周五下午6点</button>
      <button onclick="setCron('0 0 1 * *')">每月1号零点</button>
      <button onclick="setCron('0 0 1 1 *')">每年元旦零点</button>
    </div>

    <div style="margin-top:16px;padding-top:16px;border-top:1px solid #d0d7de;">
      <div style="font-size:13px;color:#57606a;margin-bottom:8px;">💬 大白话生成（直接说你想什么时候执行）：</div>
      <input type="text" id="cronDesc" placeholder="比如：每天早上9点 / 每周一中午12点 / 每月1号凌晨3点" style="margin-bottom:8px;">
      <button onclick="genCron()" style="padding:8px 16px;font-size:13px;">生成 Cron</button>
      <div id="genResult" style="margin-top:8px;font-size:13px;color:#1a7f37;display:none;"></div>
    </div>

    <div class="desc-box" id="desc" style="display:none"></div>
  </div>

  <div class="card">
    <div class="label">字段说明</div>
    <table>
      <tr><th>字段</th><th>允许值</th><th>允许符号</th></tr>
      <tr><td>分钟</td><td>0-59</td><td>, - * /</td></tr>
      <tr><td>小时</td><td>0-23</td><td>, - * /</td></tr>
      <tr><td>日期</td><td>1-31</td><td>, - * / ? L W</td></tr>
      <tr><td>月份</td><td>1-12</td><td>, - * /</td></tr>
      <tr><td>星期</td><td>0-7（0和7都是周日）</td><td>, - * / ? L #</td></tr>
    </table>
  </div>
</div>
<script>
function setCron(v) { document.getElementById('cron').value = v; parse(); }
function parse() {
  const parts = document.getElementById('cron').value.trim().split(/\s+/);
  if (parts.length !== 5) { alert('Cron 表达式必须是 5 段：分 时 日 月 周'); return; }
  const [min, hour, day, month, week] = parts;
  let text = describe(min, '分钟') + '，' + describe(hour, '小时') + '，' + describeDay(day, week);
  const d = document.getElementById('desc');
  d.style.display = 'block';
  d.innerHTML = '<div class="label">含义</div>' + text;
}
function describe(v, unit) {
  if (v === '*') return '每' + unit;
  if (v.startsWith('*/')) return '每 ' + v.slice(2) + ' ' + unit;
  if (v.includes('-')) {
    const [a, b] = v.split('-');
    return unit + '从 ' + a + ' 到 ' + b;
  }
  if (v.includes(',')) return unit + '为 ' + v;
  return unit + '为 ' + v;
}
function describeWeek(week) {
  const names = ['周日','周一','周二','周三','周四','周五','周六'];
  if (week === '*') return '';
  if (week.includes('-')) {
    const [a, b] = week.split('-').map(n => names[+n]);
    return a + '到' + b;
  }
  if (week.includes(',')) {
    return week.split(',').map(n => names[+n]).join('、');
  }
  return names[+week] || week;
}
function describeDay(day, week) {
  let s = '';
  if (day !== '*') s += '在 ' + day + ' 号';
  const w = describeWeek(week);
  if (w) s += (day !== '*' ? ' 且 ' : '') + w;
  return s || '每天';
}
// 大白话生成 cron
function genCron() {
  const text = document.getElementById('cronDesc').value.trim();
  if (!text) return;

  let min = '*', hour = '*', day = '*', month = '*', week = '*';
  let result = '';

  // 提取时间（几点几分）
  let timeMatch = text.match(/(\d{1,2})[点时:：](\d{1,2})?分?/);
  if (timeMatch) {
    hour = timeMatch[1];
    min = timeMatch[2] || '0';
    // 下午/晚上
    if (/下午|晚上|傍晚/.test(text) && hour < 12) hour = Number(hour) + 12;
  } else {
    // 早上几点
    timeMatch = text.match(/早上(\d{1,2})点?/);
    if (timeMatch) { hour = timeMatch[1]; min = '0'; }
    else if (/零点|凌晨0点/.test(text)) { hour = '0'; min = '0'; }
    else if (/中午12点/.test(text)) { hour = '12'; min = '0'; }
  }

  // 每天
  if (/每天|每日/.test(text)) {
    // 每天就是 * * *
  }

  // 每周
  const weekMap = {'日':'0','天':'0','一':'1','二':'2','三':'3','四':'4','五':'5','六':'6'};
  let weekMatch = text.match(/每周([一二三四五六日天])/);
  if (weekMatch) {
    week = weekMap[weekMatch[1]];
    day = '*';
  }

  // 每月
  let dayMatch = text.match(/每月(\d{1,2})号?/);
  if (dayMatch) {
    day = dayMatch[1];
    week = '*';
  }

  // 每小时
  if (/每小时/.test(text)) {
    hour = '*';
    min = '0';
  }

  // 每分钟
  if (/每分钟/.test(text)) {
    min = '*';
    hour = '*';
  }

  // 每N分钟
  let nMinMatch = text.match(/每(\d+)分钟/);
  if (nMinMatch) {
    min = '*/' + nMinMatch[1];
    hour = '*';
  }

  const cron = `${min} ${hour} ${day} ${month} ${week}`;
  document.getElementById('cron').value = cron;
  parse();

  const r = document.getElementById('genResult');
  r.style.display = 'block';
  r.innerHTML = `✅ 生成：<code style="background:#f6f8fa;padding:2px 6px;border-radius:4px;">${cron}</code>`;
}

parse();
</script>
</body>
</html>
