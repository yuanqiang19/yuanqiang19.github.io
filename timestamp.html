<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>时间戳转换 - 元强工具箱</title>
<meta name="description" content="在线Unix时间戳转换工具：时间戳转北京时间、日期时间转时间戳，支持秒级与毫秒级自动识别，实时显示当前时间戳。">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f6f8fa; color: #24292f; line-height: 1.6;
    padding: 20px; min-height: 100vh;
  }
  .container { max-width: 720px; margin: 0 auto; }
  .topbar { margin-bottom: 20px; }
  .topbar a { color: #0969da; text-decoration: none; font-size: 14px; }
  h1 { font-size: 22px; margin-bottom: 20px; }
  .current {
    background: #fff; border: 1px solid #d0d7de; border-radius: 8px;
    padding: 18px; margin-bottom: 16px; text-align: center;
  }
  .current .ts { font-size: 30px; font-weight: 600; color: #0969da; font-variant-numeric: tabular-nums; }
  .current .date { font-size: 14px; color: #57606a; margin-top: 4px; }
  .card {
    background: #fff; border: 1px solid #d0d7de; border-radius: 8px;
    padding: 20px; margin-bottom: 16px;
  }
  .card h2 { font-size: 15px; margin-bottom: 12px; color: #57606a; }
  .row { display: flex; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
  input[type="text"], input[type="datetime-local"] {
    flex: 1; min-width: 200px;
    padding: 9px 12px; border: 1px solid #d0d7de; border-radius: 6px;
    font-size: 14px; outline: none; font-family: inherit;
  }
  input:focus { border-color: #0969da; }
  button {
    padding: 9px 18px; background: #1f883d; color: #fff;
    border: none; border-radius: 6px; cursor: pointer; font-size: 14px;
  }
  button:hover { background: #1a7f37; }
  button.secondary {
    background: #f6f8fa; color: #24292f; border: 1px solid #d0d7de;
    padding: 2px 8px; font-size: 12px; margin-left: 6px;
  }
  button.secondary:hover { background: #eef1f4; }
  .result {
    margin-top: 12px; padding: 14px; background: #f6f8fa;
    border-radius: 6px; font-size: 14px; display: none;
  }
  .result.show { display: block; }
  .result .label { color: #57606a; font-size: 12px; margin-top: 8px; }
  .result .label:first-child { margin-top: 0; }
  .result .value { font-size: 16px; font-weight: 500; font-variant-numeric: tabular-nums; }
  .hint { font-size: 12px; color: #8b949e; margin-top: 6px; }
</style>
</head>
<body>
<div class="container">
  <div class="topbar"><a href="index.html">← 返回工具箱</a></div>
  <h1>⏰ 时间戳转换</h1>

  <div class="current">
    <div class="ts" id="currentTs">-</div>
    <div class="date" id="currentDate">-</div>
  </div>

  <div class="card">
    <h2>时间戳 → 日期时间</h2>
    <div class="row">
      <input type="text" id="tsInput" placeholder="输入时间戳，自动识别秒/毫秒，如 1730688000 或 1730688000000">
      <button onclick="tsToDate()">转换</button>
    </div>
    <div style="margin:8px 0;font-size:12px;color:#57606a;">快捷填入：
      <button class="secondary" onclick="quickTs(0)">当前时间</button>
      <button class="secondary" onclick="quickTs(1)">今天0点</button>
      <button class="secondary" onclick="quickTs(24*3600)">昨天0点</button>
      <button class="secondary" onclick="quickTs(7*24*3600)">7天前</button>
      <button class="secondary" onclick="quickTs(30*24*3600)">30天前</button>
      <button class="secondary" onclick="quickTs(365*24*3600)">1年前</button>
    </div>
    <div class="result" id="tsResult"></div>
  </div>

  <div class="card">
    <h2>日期时间 → 时间戳</h2>
    <div class="row">
      <input type="datetime-local" id="dateInput" step="1">
      <button onclick="dateToTs()">转换</button>
    </div>
    <div class="result" id="dateResult"></div>
    <div class="hint">注：日期时间按你浏览器本地时区（中国大陆为 UTC+8）解析。</div>
  </div>

  <div class="card">
    <h2>💬 大白话转时间戳</h2>
    <input type="text" id="descTs" placeholder="比如：2026年11月5日下午3点 / 明天早上8点 / 一周后" style="margin-bottom:10px;">
    <button onclick="descToTs()">转换</button>
    <div class="result" id="descResult"></div>
  </div>
</div>

<script>
function tick() {
  const now = new Date();
  document.getElementById('currentTs').textContent = Math.floor(now.getTime() / 1000);
  document.getElementById('currentDate').textContent =
    now.toLocaleString('zh-CN', { timeZone: 'Asia/Shanghai', hour12: false }) + '（北京时间）';
}
tick();
setInterval(tick, 1000);

function tsToDate() {
  const raw = document.getElementById('tsInput').value.trim();
  if (!raw || isNaN(Number(raw))) { alert('请输入有效数字'); return; }
  let n = Number(raw);
  const unit = n > 1e12 ? '毫秒' : '秒';
  if (unit === '毫秒') n = n / 1000;
  const d = new Date(n * 1000);
  if (isNaN(d.getTime())) { alert('时间戳无效'); return; }
  const bj = d.toLocaleString('zh-CN', { timeZone: 'Asia/Shanghai', hour12: false });
  const utc = d.toISOString().replace('T', ' ').replace(/\.\d+Z$/, ' UTC');
  document.getElementById('tsResult').innerHTML =
    '<div class="label">识别为：' + unit + '级时间戳</div>' +
    '<div class="label">北京时间（UTC+8）</div>' +
    '<div class="value">' + bj + ' <button class="secondary" onclick="copyText(\'' + bj.replace(/'/g, "\\'") + '\', this)">复制</button></div>' +
    '<div class="label">UTC 标准时间</div>' +
    '<div class="value">' + utc + '</div>';
  document.getElementById('tsResult').classList.add('show');
}

function dateToTs() {
  const v = document.getElementById('dateInput').value;
  if (!v) { alert('请选择日期时间'); return; }
  const d = new Date(v);
  if (isNaN(d.getTime())) { alert('时间无效'); return; }
  const sec = Math.floor(d.getTime() / 1000);
  const ms = d.getTime();
  document.getElementById('dateResult').innerHTML =
    '<div class="label">秒级时间戳</div>' +
    '<div class="value">' + sec + ' <button class="secondary" onclick="copyText(\'' + sec + '\', this)">复制</button></div>' +
    '<div class="label">毫秒级时间戳</div>' +
    '<div class="value">' + ms + ' <button class="secondary" onclick="copyText(\'' + ms + '\', this)">复制</button></div>';
  document.getElementById('dateResult').classList.add('show');
}

// 大白话转时间戳
function descToTs() {
  const text = document.getElementById('descTs').value.trim();
  if (!text) return;
  let d = new Date();

  // 明天
  if (/明天/.test(text)) {
    d.setDate(d.getDate() + 1);
  }
  // 后天
  if (/后天/.test(text)) {
    d.setDate(d.getDate() + 2);
  }
  // 昨天
  if (/昨天/.test(text)) {
    d.setDate(d.getDate() - 1);
  }
  // N天后
  let m = text.match(/(\d+)天后/);
  if (m) d.setDate(d.getDate() + Number(m[1]));
  // N周后
  m = text.match(/(\d+)周后/);
  if (m) d.setDate(d.getDate() + Number(m[1]) * 7);
  // N月后
  m = text.match(/(\d+)月后/);
  if (m) d.setMonth(d.getMonth() + Number(m[1]));

  // 提取具体时间（几点几分）
  let timeMatch = text.match(/(\d{1,2})[点时:：](\d{1,2})?分?/);
  if (timeMatch) {
    let h = Number(timeMatch[1]);
    let min = Number(timeMatch[2]) || 0;
    if (/下午|晚上|傍晚/.test(text) && h < 12) h += 12;
    d.setHours(h, min, 0, 0);
  }

  // 提取具体日期（XXXX年XX月XX日）
  let dateMatch = text.match(/(\d{4})年(\d{1,2})月(\d{1,2})日?/);
  if (dateMatch) {
    d = new Date(Number(dateMatch[1]), Number(dateMatch[2]) - 1, Number(dateMatch[3]));
    if (timeMatch) {
      let h = Number(timeMatch[1]);
      if (/下午|晚上/.test(text) && h < 12) h += 12;
      d.setHours(h, Number(timeMatch[2]) || 0, 0, 0);
    }
  }

  const sec = Math.floor(d.getTime() / 1000);
  const bj = d.toLocaleString('zh-CN', { timeZone: 'Asia/Shanghai', hour12: false });
  const r = document.getElementById('descResult');
  r.style.display = 'block';
  r.innerHTML =
    '<div class="label">你说的是：' + bj + '（北京时间）</div>' +
    '<div class="label">秒级时间戳</div>' +
    '<div class="value">' + sec + ' <button class="secondary" onclick="copyText(\'' + sec + '\', this)">复制</button></div>' +
    '<div class="label">毫秒级时间戳</div>' +
    '<div class="value">' + d.getTime() + '</div>';
}

function quickTs(type) {
  const now = new Date();
  let ts;
  if (type === 0) {
    ts = Math.floor(now.getTime() / 1000);
  } else {
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    ts = Math.floor(today.getTime() / 1000) - type;
  }
  document.getElementById('tsInput').value = ts;
  tsToDate();
}

function copyText(t, btn) {
  navigator.clipboard.writeText(t).then(() => {
    const old = btn.textContent;
    btn.textContent = '已复制';
    setTimeout(() => btn.textContent = old, 1000);
  });
}
</script>
</body>
</html>
