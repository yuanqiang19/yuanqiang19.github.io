<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Markdown 编辑器 - 元强工具箱</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f6f8fa; color: #24292f; line-height: 1.6; padding: 20px; min-height: 100vh; }
  .container { max-width: 1000px; margin: 0 auto; }
  .topbar { margin-bottom: 20px; }
  .topbar a { color: #0969da; text-decoration: none; font-size: 14px; }
  h1 { font-size: 22px; margin-bottom: 20px; }
  .editor-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  @media (max-width: 768px) { .editor-wrap { grid-template-columns: 1fr; } }
  .panel { background: #fff; border: 1px solid #d0d7de; border-radius: 8px; padding: 16px; }
  .panel h2 { font-size: 14px; color: #57606a; margin-bottom: 12px; }
  textarea { width: 100%; height: 500px; padding: 12px; border: 1px solid #d0d7de; border-radius: 6px; font-size: 14px; resize: vertical; font-family: Consolas, monospace; }
  .preview { height: 500px; overflow-y: auto; padding: 12px; background: #f6f8fa; border-radius: 6px; }
  .preview h1, .preview h2, .preview h3 { margin: 12px 0 8px; }
  .preview p { margin: 8px 0; }
  .preview code { background: #eaeef2; padding: 2px 6px; border-radius: 4px; font-size: 13px; }
  .preview pre { background: #1f2328; color: #e6edf3; padding: 12px; border-radius: 6px; overflow-x: auto; margin: 8px 0; }
  .preview pre code { background: none; color: inherit; }
  .preview blockquote { border-left: 4px solid #d0d7de; padding-left: 12px; color: #57606a; margin: 8px 0; }
  .preview table { border-collapse: collapse; margin: 8px 0; }
  .preview th, .preview td { border: 1px solid #d0d7de; padding: 6px 12px; }
  .toolbar { margin-bottom: 16px; }
  button { padding: 6px 12px; border: 1px solid #d0d7de; background: #fff; border-radius: 6px; cursor: pointer; font-size: 13px; margin-right: 8px; }
  button:hover { background: #f6f8fa; }
</style>
</head>
<body>
<div class="container">
  <div class="topbar"><a href="index.html">← 返回工具箱</a></div>
  <h1>📝 Markdown 编辑器</h1>

  <div class="toolbar">
    <button onclick="loadSample()">示例</button>
    <button onclick="clearAll()">清空</button>
  </div>

  <div class="editor-wrap">
    <div class="panel">
      <h2>✏️ 编辑</h2>
      <textarea id="editor" oninput="render()" placeholder="在这里写 Markdown..."></textarea>
    </div>
    <div class="panel">
      <h2>👁️ 预览</h2>
      <div class="preview" id="preview"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
<script>
function render() {
  const md = document.getElementById('editor').value;
  document.getElementById('preview').innerHTML = marked.parse(md);
}

function loadSample() {
  document.getElementById('editor').value = `# 标题一

## 标题二

这是一段**加粗**文字，这是*斜体*，这是~~删除线~~。

## 列表

- 第一项
- 第二项
- 第三项

1. 有序列表一
2. 有序列表二

## 代码

\`console.log("Hello World")\`

\`\`\`javascript
function hello() {
  console.log("Hello!");
}
\`\`\`

## 引用

> 这是一段引用文字。

## 表格

| 姓名 | 年龄 | 城市 |
|------|------|------|
| 张三 | 28 | 绵阳 |
| 李四 | 32 | 成都 |

## 链接和图片

[百度](https://www.baidu.com)
`;
  render();
}

function clearAll() {
  document.getElementById('editor').value = '';
  render();
}

loadSample();
</script>
</body>
</html>
