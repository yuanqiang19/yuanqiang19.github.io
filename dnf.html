<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DNF 属强提升率 - 元强工具箱</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f6f8fa; color: #24292f; line-height: 1.6; padding: 20px; min-height: 100vh; }
  .container { max-width: 600px; margin: 0 auto; }
  .topbar { margin-bottom: 20px; }
  .topbar a { color: #0969da; text-decoration: none; font-size: 14px; }
  h1 { font-size: 22px; margin-bottom: 8px; }
  .desc { font-size: 13px; color: #57606a; margin-bottom: 20px; }
  .card { background: #fff; border: 1px solid #d0d7de; border-radius: 8px; padding: 20px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; color: #57606a; margin-bottom: 4px; }
  .field input { width: 100%; padding: 8px 12px; border: 1px solid #d0d7de; border-radius: 6px; font-size: 14px; outline: none; }
  .field input:focus { border-color: #0969da; }
  button { width: 100%; padding: 10px; background: #1f883d; color: #fff; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; margin-top: 8px; }
  button.secondary { width:auto; padding:5px 10px; font-size:12px; background:#f6f8fa; color:#24292f; border:1px solid #d0d7de; margin:2px; }
  .result { margin-top: 16px; display: none; padding: 16px; background: #f6f8fa; border-radius: 6px; }
  .result.show { display: block; }
  .result .big { font-size: 32px; font-weight: 600; color: #0969da; text-align: center; }
  .result .sub { font-size: 13px; color: #57606a; text-align: center; margin-top: 6px; }
  .formula { margin-top: 14px; padding: 10px; background: #fff; border-radius: 6px; font-size: 12px; color: #57606a; font-family: monospace; }
</style>
</head>
<body>
<div class="container">
  <div class="topbar"><a href="index.html">← 返回工具箱</a></div>
  <h1>⚔️ DNF 属强提升率</h1>
  <div class="desc">公式：提升率 = 新增属强 ÷ (当前属强 + 220)。属强边际递减，与技伤/攻击强化属独立乘区。</div>
  <div class="card">
    <div class="field">
      <label>当前属强</label>
      <input type="number" id="cur" value="200">
    </div>
    <div class="field">
      <label>新增属强（想堆多少）</label>
      <input type="number" id="add" value="35">
    </div>
    <div style="margin-bottom:10px;font-size:12px;color:#57606a;">常用场景：
      <button class="secondary" onclick="preset(200,35)">零氪入门(200→235)</button>
      <button class="secondary" onclick="preset(300,50)">中等打造(300→350)</button>
      <button class="secondary" onclick="preset(400,60)">高增幅(400→460)</button>
      <button class="secondary" onclick="preset(500,70)">土豪级(500→570)</button>
    </div>
    <button onclick="calc()">计算提升率</button>
    <div class="result" id="result">
      <div class="big" id="pct">-</div>
      <div class="sub" id="detail">-</div>
      <div class="formula" id="formula"></div>
    </div>

    <div style="margin-top:20px;padding-top:16px;border-top:1px solid #d0d7de;">
      <div style="font-size:13px;color:#57606a;margin-bottom:8px;">💬 大白话计算：</div>
      <input type="text" id="descDnf" placeholder="比如：我现在200属强，想堆到235，提升多少？" style="margin-bottom:10px;">
      <button onclick="descCalc()" style="margin-top:0;">计算</button>
    </div>
  </div>
</div>
<script>
// 大白话计算
function descCalc() {
  const text = document.getElementById('descDnf').value.trim();
  if (!text) return;

  // 提取两个数字
  const nums = text.match(/\d+/g);
  if (!nums || nums.length < 2) {
    alert('没识别到两个数字，试试写：我现在200属强，堆到235提升多少');
    return;
  }

  const cur = Number(nums[0]);
  const target = Number(nums[1]);
  const add = target - cur;

  document.getElementById('cur').value = cur;
  document.getElementById('add').value = add;
  calc();
}

function preset(cur, add) {
  document.getElementById('cur').value = cur;
  document.getElementById('add').value = add;
  calc();
}

function calc() {
  const cur = parseFloat(document.getElementById('cur').value);
  const add = parseFloat(document.getElementById('add').value);
  if (isNaN(cur) || isNaN(add)) return alert('请输入数字');
  const rate = add / (cur + 220);
  const pct = (rate * 100).toFixed(2);
  document.getElementById('pct').textContent = '+' + pct + '%';
  document.getElementById('detail').textContent =
    `从 ${cur} 属强堆到 ${cur + add} 属强，伤害提升约 ${pct}%`;
  document.getElementById('formula').textContent =
    `计算：${add} ÷ (${cur} + 220) = ${rate.toFixed(4)} ≈ ${pct}%`;
  document.getElementById('result').classList.add('show');
}
</script>
</body>
</html>
