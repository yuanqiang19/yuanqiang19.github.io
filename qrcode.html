<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>二维码生成器 - 元强工具箱</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f6f8fa; color: #24292f; line-height: 1.6; padding: 20px; min-height: 100vh; }
  .container { max-width: 600px; margin: 0 auto; }
  .topbar { margin-bottom: 20px; }
  .topbar a { color: #0969da; text-decoration: none; font-size: 14px; }
  h1 { font-size: 22px; margin-bottom: 20px; }
  .card { background: #fff; border: 1px solid #d0d7de; border-radius: 8px; padding: 20px; margin-bottom: 16px; }
  textarea { width: 100%; height: 80px; padding: 10px; border: 1px solid #d0d7de; border-radius: 6px; font-size: 14px; resize: vertical; }
  .row { display: flex; gap: 10px; margin-top: 12px; align-items: center; }
  select { padding: 8px; border: 1px solid #d0d7de; border-radius: 6px; font-size: 14px; }
  button { padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; background: #2da44e; color: #fff; }
  button:hover { opacity: 0.9; }
  .qr-preview { text-align: center; margin-top: 20px; padding: 20px; background: #f6f8fa; border-radius: 8px; }
  .qr-preview canvas { background: #fff; padding: 16px; border-radius: 8px; }
  .tip { font-size: 12px; color: #57606a; margin-top: 12px; text-align: center; }
</style>
</head>
<body>
<div class="container">
  <div class="topbar"><a href="index.html">← 返回工具箱</a></div>
  <h1>🔲 二维码生成器</h1>

  <div class="card">
    <textarea id="text" placeholder="输入链接或文本，自动生成二维码..." oninput="gen()">https://yuanqiang19.github.io</textarea>

    <div class="row">
      <label style="font-size:14px;">尺寸：</label>
      <select id="size" onchange="gen()">
        <option value="200">小 (200px)</option>
        <option value="300" selected>中 (300px)</option>
        <option value="400">大 (400px)</option>
      </select>
      <button onclick="download()">⬇️ 下载图片</button>
    </div>

    <div class="qr-preview">
      <canvas id="qr"></canvas>
      <div class="tip">扫码即可打开链接/查看文本</div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>
<script>
function gen() {
  const text = document.getElementById('text').value;
  const size = parseInt(document.getElementById('size').value);
  if (!text) return;
  QRCode.toCanvas(document.getElementById('qr'), text, {
    width: size,
    margin: 2,
    color: { dark: '#000000', light: '#ffffff' }
  });
}

function download() {
  const canvas = document.getElementById('qr');
  const link = document.createElement('a');
  link.download = 'qrcode.png';
  link.href = canvas.toDataURL('image/png');
  link.click();
}

gen();
</script>
</body>
</html>
