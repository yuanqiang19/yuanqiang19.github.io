<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JSON 格式化 - 元强工具箱</title>
<meta name="description" content="在线JSON格式化工具：美化压缩JSON、转义反转义、语法校验，支持中文不转义，纯前端本地处理数据不上传。">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: #f6f8fa; color: #24292f; line-height: 1.6;
    padding: 20px; min-height: 100vh;
  }
  .container { max-width: 1100px; margin: 0 auto; }
  .topbar { margin-bottom: 20px; }
  .topbar a { color: #0969da; text-decoration: none; font-size: 14px; }
  h1 { font-size: 22px; margin-bottom: 20px; }
  .card {
    background: #fff; border: 1px solid #d0d7de; border-radius: 8px;
    padding: 16px;
  }
  .toolbar {
    display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 12px;
  }
  button {
    padding: 7px 14px; background: #1f883d; color: #fff;
    border: none; border-radius: 6px; cursor: pointer; font-size: 13px;
  }
  button:hover { background: #1a7f37; }
  button.secondary {
    background: #f6f8fa; color: #24292f; border: 1px solid #d0d7de;
  }
  button.secondary:hover { background: #eef1f4; }
  button.danger { background: #cf222e; }
  button.danger:hover { background: #a40e26; }
  .editor-area {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px;
  }
  @media (max-width: 720px) {
    .editor-area { grid-template-columns: 1fr; }
  }
  textarea {
    width: 100%; height: 420px;
    padding: 12px; border: 1px solid #d0d7de; border-radius: 6px;
    font-family: "SF Mono", Consolas, Monaco, "Courier New", monospace;
    font-size: 13px; line-height: 1.5;
    resize: vertical; outline: none;
  }
  textarea:focus { border-color: #0969da; }
  #output { background: #f6f8fa; }
  .label {
    font-size: 12px; color: #57606a; margin-bottom: 4px; font-weight: 600;
  }
  .error {
    margin-top: 10px; padding: 10px 12px; border-radius: 6px;
    background: #ffebe9; color: #cf222e; font-size: 13px;
    display: none;
  }
  .error.show { display: block; }
  .ok {
    margin-top: 10px; padding: 10px 12px; border-radius: 6px;
    background: #dafbe1; color: #1a7f37; font-size: 13px;
    display: none;
  }
  .ok.show { display: block; }
  .builder-row { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; }
  .builder-row input[type=text] { padding: 6px 10px; font-size: 13px; }
  .builder-row select { padding: 6px 8px; font-size: 13px; border: 1px solid #d0d7de; border-radius: 6px; background: #fff; }
  .builder-row .del-btn { background: #cf222e; padding: 5px 10px; font-size: 12px; }
</style>
</head>
<body>
<div class="container">
  <div class="topbar"><a href="index.html">← 返回工具箱</a></div>
  <h1>{ } JSON 格式化</h1>

  <div class="card">
    <div class="toolbar">
      <button onclick="format()">格式化（美化）</button>
      <button onclick="minify()">压缩</button>
      <button onclick="escape()">转义为字符串</button>
      <button onclick="unescape()">反转义</button>
      <button onclick="copyResult()">复制结果</button>
      <button onclick="loadSample()" class="secondary">示例</button>
      <select id="templateSelect" onchange="loadTemplate(this.value)" class="secondary" style="padding:7px 10px;border-radius:6px;border:1px solid #d0d7de;background:#f6f8fa;font-size:13px;">
        <option value="">📋 常用模板</option>
        <option value="user">用户信息</option>
        <option value="config">配置文件</option>
        <option value="api">API 返回</option>
        <option value="array">列表/数组</option>
        <option value="nested">嵌套对象</option>
        <option value="form">表单数据</option>
      </select>
      <button onclick="document.getElementById('fileInput').click()" class="secondary">📁 上传JSON文件</button>
      <input type="file" id="fileInput" accept=".json,.txt" style="display:none" onchange="loadFile(event)">
      <button onclick="clearAll()" class="danger">清空</button>
    </div>

    <div class="editor-area">
      <div>
        <div class="label">输入</div>
        <textarea id="input" placeholder='在此粘贴 JSON，例如：{"name":"张三","age":30}'></textarea>
      </div>
      <div>
        <div class="label">输出</div>
        <textarea id="output" readonly placeholder="结果显示在这里..."></textarea>
      </div>
    </div>

    <div id="error" class="error"></div>
    <div id="ok" class="ok"></div>
  </div>

  <div class="card" style="margin-top:16px;">
    <h2 style="font-size:16px;margin-bottom:12px;">💬 文字描述生成 JSON</h2>
    <p style="font-size:13px;color:#57606a;margin-bottom:8px;">
      直接写大白话就行，自动识别提取键值对。两种方式都支持：
    </p>
    <div style="background:#f6f8fa;padding:10px;border-radius:6px;font-size:12px;color:#57606a;margin-bottom:10px;font-family:Consolas,monospace;">
      <b>方式一（标准格式）：</b>姓名=张三,年龄=28,是会员=true<br>
      <b>方式二（大白话）：</b>我叫张三，今年28岁，是会员，邮箱zhangsan@qq.com，住在绵阳
    </div>
    <textarea id="descInput" placeholder="在这里写你的描述，比如：&#10;我叫张三，今年28岁，是会员，邮箱是zhangsan@qq.com" style="height:100px;font-size:13px;"></textarea>
    <div style="margin-top:10px;">
      <button onclick="buildFromDesc()">🔨 根据描述生成 JSON</button>
    </div>
  </div>

  <div class="card" style="margin-top:16px;">
    <h2 style="font-size:16px;margin-bottom:12px;">🛠️ 可视化生成器（填表格自动生成）</h2>
    <div id="builderRows"></div>
    <div style="margin-top:10px;">
      <button onclick="addRow()" class="secondary">+ 添加字段</button>
      <button onclick="buildJson()" style="margin-left:8px;">🔨 生成 JSON</button>
    </div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

function showError(msg) {
  const e = $('error');
  e.textContent = '❌ ' + msg;
  e.classList.add('show');
  $('ok').classList.remove('show');
}
function showOk(msg) {
  const o = $('ok');
  o.textContent = '✅ ' + msg;
  o.classList.add('show');
  $('error').classList.remove('show');
}
function clearMsgs() {
  $('error').classList.remove('show');
  $('ok').classList.remove('show');
}

function format() {
  const raw = $('input').value.trim();
  if (!raw) return showError('请输入 JSON');
  try {
    const obj = JSON.parse(raw);
    // 2空格缩进，中文不转义
    $('output').value = JSON.stringify(obj, null, 2);
    showOk('JSON 合法，已格式化');
  } catch (err) {
    showError('JSON 语法错误：' + err.message);
  }
}

function minify() {
  const raw = $('input').value.trim();
  if (!raw) return showError('请输入 JSON');
  try {
    const obj = JSON.parse(raw);
    $('output').value = JSON.stringify(obj);
    showOk('已压缩为单行');
  } catch (err) {
    showError('JSON 语法错误：' + err.message);
  }
}

function escape() {
  const raw = $('input').value;
  if (!raw) return showError('请输入内容');
  // 把 JSON 字符串转义成可嵌入代码的字符串
  $('output').value = JSON.stringify(raw);
  showOk('已转义为字符串字面量');
}

function unescape() {
  const raw = $('input').value.trim();
  if (!raw) return showError('请输入内容');
  try {
    let decoded;
    // 如果输入本身就是带引号的字符串字面量，直接 parse
    if ((raw.startsWith('"') && raw.endsWith('"')) || (raw.startsWith("'") && raw.endsWith("'"))) {
      decoded = JSON.parse(raw.replace(/^'|'$/g, '"'));
    } else {
      // 否则给它加上双引号再 parse，解码里面的转义序列
      decoded = JSON.parse('"' + raw.replace(/"/g, '\\"') + '"');
    }
    // 如果解码后是合法 JSON 对象，顺便美化
    try {
      const obj = JSON.parse(decoded);
      $('output').value = JSON.stringify(obj, null, 2);
    } catch (e) {
      $('output').value = decoded;
    }
    showOk('已反转义');
  } catch (err) {
    showError('反转义失败：输入内容不是有效的转义字符串');
  }
}

function copyResult() {
  const v = $('output').value;
  if (!v) return showError('没有可复制的内容');
  navigator.clipboard.writeText(v).then(() => showOk('已复制到剪贴板'));
}

function loadSample() {
  $('input').value = '{"name":"元强工具箱","version":"1.0","tools":["IP查询","时间戳","JSON"],"active":true,"author":null}';
  clearMsgs();
}

function loadTemplate(type) {
  if (!type) return;
  const templates = {
    user: '{\n  "id": 1001,\n  "username": "zhangsan",\n  "nickname": "张三",\n  "email": "zhangsan@example.com",\n  "age": 28,\n  "gender": "male",\n  "phone": "13800138000",\n  "avatar": "https://example.com/avatar.jpg",\n  "isVip": false,\n  "createTime": "2026-11-01T10:00:00Z"\n}',
    config: '{\n  "appName": "MyApp",\n  "version": "1.0.0",\n  "debug": true,\n  "port": 8080,\n  "host": "0.0.0.0",\n  "database": {\n    "host": "localhost",\n    "port": 3306,\n    "username": "root",\n    "password": "******",\n    "name": "myapp_db"\n  },\n  "features": {\n    "login": true,\n    "register": true,\n    "captcha": false\n  }\n}',
    api: '{\n  "code": 200,\n  "message": "success",\n  "data": {\n    "total": 100,\n    "page": 1,\n    "pageSize": 10,\n    "list": [\n      { "id": 1, "title": "第一条数据" },\n      { "id": 2, "title": "第二条数据" }\n    ]\n  },\n  "timestamp": 1730707200000\n}',
    array: '{\n  "users": [\n    { "id": 1, "name": "张三" },\n    { "id": 2, "name": "李四" },\n    { "id": 3, "name": "王五" }\n  ],\n  "tags": ["前端", "后端", "运维", "测试"],\n  "scores": [95, 88, 76, 92, 85]\n}',
    nested: '{\n  "company": "科技有限公司",\n  "address": {\n    "province": "四川省",\n    "city": "绵阳市",\n    "detail": "涪城区XX路XX号",\n    "zipcode": "621000"\n  },\n  "contact": {\n    "phone": "0816-1234567",\n    "email": "contact@example.com",\n    "wechat": "company_wechat"\n  },\n  "employees": [\n    {\n      "name": "张三",\n      "position": "前端工程师",\n      "skills": ["HTML", "CSS", "JavaScript"]\n    }\n  ]\n}',
    form: '{\n  "username": "",\n  "password": "",\n  "confirmPassword": "",\n  "email": "",\n  "phone": "",\n  "agree": false,\n  "captcha": ""\n}'
  };
  $('input').value = templates[type] || '';
  clearMsgs();
  format();
  document.getElementById('templateSelect').value = '';
}

function loadFile(event) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    $('input').value = e.target.result;
    clearMsgs();
    showOk('已加载文件：' + file.name);
    format();
  };
  reader.readAsText(file);
  event.target.value = '';
}

function clearAll() {
  $('input').value = '';
  $('output').value = '';
  clearMsgs();
}

// JSON 生成器
function addRow(key, value, type) {
  key = key || '';
  value = value || '';
  type = type || 'string';
  const row = document.createElement('div');
  row.className = 'builder-row';
  row.innerHTML = `
    <input type="text" placeholder="键名" value="${key}" style="width:150px;">
    <select>
      <option value="string" ${type==='string'?'selected':''}>文本</option>
      <option value="number" ${type==='number'?'selected':''}>数字</option>
      <option value="boolean" ${type==='boolean'?'selected':''}>布尔</option>
      <option value="null" ${type==='null'?'selected':''}>null</option>
    </select>
    <input type="text" placeholder="值" value="${value}" style="flex:1;">
    <button class="del-btn" onclick="this.parentElement.remove()">删除</button>
  `;
  $('builderRows').appendChild(row);
}

function buildJson() {
  const rows = document.querySelectorAll('.builder-row');
  const obj = {};
  rows.forEach(row => {
    const inputs = row.querySelectorAll('input');
    const selects = row.querySelectorAll('select');
    const key = inputs[0].value.trim();
    const type = selects[0].value;
    const val = inputs[1].value;
    if (!key) return;
    if (type === 'string') obj[key] = val;
    else if (type === 'number') obj[key] = Number(val) || 0;
    else if (type === 'boolean') obj[key] = val === 'true' || val === '1';
    else if (type === 'null') obj[key] = null;
  });
  $('input').value = JSON.stringify(obj, null, 2);
  clearMsgs();
  format();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// 文字描述生成 JSON（智能识别大白话 + 标准格式，两种都解析合并）
function buildFromDesc() {
  const text = $('descInput').value.trim();
  if (!text) return showError('请先写描述');

  const obj = {};

  // 1. 先解析标准格式：键名=值 或 键名：值
  const lines = text.split(/[\n,，;；]/).map(l => l.trim()).filter(l => l);
  for (const line of lines) {
    const match = line.match(/^([^=:：]+)[=:：](.+)$/);
    if (match) {
      const key = match[1].trim();
      let val = match[2].trim();
      obj[key] = autoType(val);
    }
  }

  // 2. 再用大白话智能识别，补充标准格式没识别到的
  // 名字/姓名
  let m = text.match(/(?:我叫|名字是|姓名是|名称是|我是)([\u4e00-\u9fa5a-zA-Z0-9]{2,10})/);
  if (m && !obj['姓名'] && !obj['名字']) obj['姓名'] = m[1];

  // 年龄
  m = text.match(/(\d{1,3})\s*(?:岁|年纪|年龄)/);
  if (m && !obj['年龄']) obj['年龄'] = Number(m[1]);

  // 邮箱
  m = text.match(/([\w.-]+@[\w.-]+\.\w+)/);
  if (m && !obj['邮箱']) obj['邮箱'] = m[1];

  // 手机号
  m = text.match(/(1[3-9]\d{9})/);
  if (m && !obj['手机号']) obj['手机号'] = m[1];

  // 是会员/VIP
  if (/是会员|VIP|开通了会员/.test(text) && !obj['是否会员']) obj['是否会员'] = true;
  if (/不是会员|没开会员/.test(text) && !obj['是否会员']) obj['是否会员'] = false;

  // 城市/地址
  m = text.match(/(?:住在|城市是|地址在|来自)([\u4e00-\u9fa5]{2,6})/);
  if (m && !obj['城市']) obj['城市'] = m[1];

  // 性别
  if (/我是男的|性别男|男生/.test(text) && !/女生|女性|我是女的/.test(text) && !obj['性别']) obj['性别'] = '男';
  if (/我是女的|性别女|女生/.test(text) && !/男生|男性|我是男的/.test(text) && !obj['性别']) obj['性别'] = '女';

  if (Object.keys(obj).length === 0) {
    return showError('没识别到内容，试试写：我叫张三，今年28岁，邮箱是xxx@qq.com');
  }

  $('input').value = JSON.stringify(obj, null, 2);
  clearMsgs();
  format();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

// 自动识别值类型
function autoType(val) {
  if (val === 'true' || val === '是' || val === '对' || val === 'yes') return true;
  if (val === 'false' || val === '否' || val === '错' || val === 'no') return false;
  if (val === 'null' || val === '空' || val === '无') return null;
  if (/^-?\d+(\.\d+)?$/.test(val)) return Number(val);
  return val;
}

// 初始化两行示例
addRow('name', '张三', 'string');
addRow('age', '28', 'number');
addRow('isVip', 'false', 'boolean');
</script>
</body>
</html>
