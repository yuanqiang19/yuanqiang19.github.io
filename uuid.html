<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UUID 生成器 - 元强工具箱</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f6f8fa; color: #24292f; line-height: 1.6; padding: 20px; min-height: 100vh; }
  .container { max-width: 600px; margin: 0 auto; }
  .topbar { margin-bottom: 20px; }
  .topbar a { color: #0969da; text-decoration: none; font-size: 14px; }
  h1 { font-size: 22px; margin-bottom: 20px; }
  .card { background: #fff; border: 1px solid #d0d7de; border-radius: 8px; padding: 20px; margin-bottom: 16px; }
  .uuid-item { display: flex; justify-content: space-between; align-items: center; padding: 10px; border-bottom: 1px solid #d0d7de; font-family: Consolas, monospace; font-size: 13px; }
  .uuid-item:last-child { border-bottom: none; }
  .uuid-item button { padding: 4px 10px; font-size: 12px; background: #f6f8fa; color: #24292f; border: 1px solid #d0d7de; cursor: pointer; border-radius: 4px; }
  .uuid-item button:hover { background: #eaeef2; }
  .toolbar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; }
  select, input[type=text] { padding: 8px; border: 1px solid #d0d7de; border-radius: 6px; font-size: 14px; }
  input[type=text] { flex: 1; min-width: 150px; }
  button { padding: 8px 16px; border: none; border-radius: 6px; cursor: pointer; font-size: 14px; background: #2da44e; color: #fff; }
  button:hover { opacity: 0.9; }
  .tabs { display: flex; gap: 0; margin-bottom: 16px; border-bottom: 2px solid #d0d7de; }
  .tab { padding: 8px 16px; cursor: pointer; font-size: 14px; color: #57606a; border-bottom: 2px solid transparent; margin-bottom: -2px; }
  .tab.active { color: #0969da; border-bottom-color: #0969da; }
  .tip { font-size: 12px; color: #57606a; margin-top: 12px; padding: 10px; background: #ddf4ff; border-radius: 6px; }
</style>
</head>
<body>
<div class="container">
  <div class="topbar"><a href="index.html">← 返回工具箱</a></div>
  <h1>🆔 UUID 生成器</h1>

  <div class="card">
    <div class="tabs">
      <div class="tab active" onclick="switchMode('random', this)">🎲 随机生成</div>
      <div class="tab" onclick="switchMode('fixed', this)">🔒 关键词固定生成</div>
    </div>

    <!-- 共用格式选项 -->
    <div class="toolbar" style="margin-bottom:16px;">
      <label style="font-size:14px;">横线：</label>
      <select id="dash" onchange="regen()">
        <option value="yes" selected>带横线</option>
        <option value="no">不带横线</option>
      </select>
      <label style="font-size:14px;">大小写：</label>
      <select id="case" onchange="regen()">
        <option value="lower" selected>小写</option>
        <option value="upper">大写</option>
      </select>
    </div>

    <!-- 随机模式 -->
    <div id="randomMode">
      <div class="toolbar">
        <label style="font-size:14px;">数量：</label>
        <select id="count">
          <option value="1">1 个</option>
          <option value="5" selected>5 个</option>
          <option value="10">10 个</option>
          <option value="20">20 个</option>
        </select>
        <button onclick="gen()">生成</button>
      </div>
    </div>

    <!-- 固定模式 -->
    <div id="fixedMode" style="display:none;">
      <div class="toolbar">
        <label style="font-size:14px;">关键词：</label>
        <input type="text" id="seed" placeholder="输入关键词，比如：用户ID、订单号" oninput="genFixed()">
      </div>
    </div>

    <div id="list"></div>

    <div class="tip" id="fixedTip" style="display:none;">
      💡 同样的关键词永远生成同样的 UUID，适合给固定数据做唯一标识。
    </div>
  </div>
</div>

<script>
let mode = 'random';

function switchMode(m, el) {
  mode = m;
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('randomMode').style.display = m === 'random' ? 'block' : 'none';
  document.getElementById('fixedMode').style.display = m === 'fixed' ? 'block' : 'none';
  document.getElementById('fixedTip').style.display = m === 'fixed' ? 'block' : 'none';
  document.getElementById('list').innerHTML = '';
}

// 简单 hash
function hashCode(str) {
  let hash = 0;
  for (let i = 0; i < str.length; i++) {
    const char = str.charCodeAt(i);
    hash = ((hash << 5) - hash) + char;
    hash = hash & hash;
  }
  return Math.abs(hash);
}

function seededRandom(seed) {
  let s = seed;
  return function() {
    s = (s * 9301 + 49297) % 233280;
    return s / 233280;
  };
}

function uuidv4() {
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
    const r = Math.random() * 16 | 0;
    const v = c === 'x' ? r : (r & 0x3 | 0x8);
    return v.toString(16);
  });
}

// 基于关键词生成固定 UUID
function uuidFromSeed(seed) {
  const hash = hashCode(seed + '元强工具箱UUID');
  const rand = seededRandom(hash);
  return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
    const r = Math.floor(rand() * 16);
    const v = c === 'x' ? r : (r & 0x3 | 0x8);
    return v.toString(16);
  });
}

function gen() {
  const count = parseInt(document.getElementById('count').value);
  const dash = document.getElementById('dash').value;
  const upper = document.getElementById('case').value === 'upper';
  let html = '';
  for (let i = 0; i < count; i++) {
    let u = uuidv4();
    if (dash === 'no') u = u.replace(/-/g, '');
    if (upper) u = u.toUpperCase();
    html += `<div class="uuid-item"><span>${u}</span><button onclick="copyUuid('${u}')">复制</button></div>`;
  }
  document.getElementById('list').innerHTML = html;
}

function genFixed() {
  const seed = document.getElementById('seed').value.trim();
  if (!seed) {
    document.getElementById('list').innerHTML = '';
    return;
  }
  const dash = document.getElementById('dash').value;
  const upper = document.getElementById('case').value === 'upper';
  let u = uuidFromSeed(seed);
  if (dash === 'no') u = u.replace(/-/g, '');
  if (upper) u = u.toUpperCase();
  document.getElementById('list').innerHTML = `<div class="uuid-item"><span>${u}</span><button onclick="copyUuid('${u}')">复制</button></div>`;
}

// 切换格式时自动重新生成
function regen() {
  if (mode === 'fixed') genFixed();
  else gen();
}

function copyUuid(u) {
  navigator.clipboard.writeText(u).then(() => alert('已复制'));
}

gen();
</script>
</body>
</html>
