<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>热量 / TDEE 计算 - 元强工具箱</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; background: #f6f8fa; color: #24292f; line-height: 1.6; padding: 20px; min-height: 100vh; }
  .container { max-width: 600px; margin: 0 auto; }
  .topbar { margin-bottom: 20px; }
  .topbar a { color: #0969da; text-decoration: none; font-size: 14px; }
  h1 { font-size: 22px; margin-bottom: 20px; }
  .card { background: #fff; border: 1px solid #d0d7de; border-radius: 8px; padding: 20px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 13px; color: #57606a; margin-bottom: 4px; }
  .field input, .field select { width: 100%; padding: 8px 12px; border: 1px solid #d0d7de; border-radius: 6px; font-size: 14px; outline: none; }
  .field input:focus { border-color: #0969da; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  button { width: 100%; padding: 10px; background: #1f883d; color: #fff; border: none; border-radius: 6px; font-size: 15px; cursor: pointer; margin-top: 8px; }
  button:hover { background: #1a7f37; }
  .result { margin-top: 16px; display: none; }
  .result.show { display: block; }
  .result-box { padding: 14px; background: #f6f8fa; border-radius: 6px; margin-bottom: 10px; }
  .result-box .num { font-size: 24px; font-weight: 600; color: #0969da; }
  .result-box .label { font-size: 12px; color: #57606a; }
</style>
</head>
<body>
<div class="container">
  <div class="topbar"><a href="index.html">← 返回工具箱</a></div>
  <h1>🔥 热量 / TDEE 计算</h1>
  <div class="card">
    <div class="grid2">
      <div class="field">
        <label>性别</label>
        <select id="sex">
          <option value="male">男</option>
          <option value="female">女</option>
        </select>
      </div>
      <div class="field">
        <label>年龄</label>
        <input type="number" id="age" value="35">
      </div>
    </div>
    <div class="grid2">
      <div class="field">
        <label>身高 (cm)</label>
        <input type="number" id="height" value="174">
      </div>
      <div class="field">
        <label>体重 (kg)</label>
        <input type="number" id="weight" value="67">
      </div>
    </div>
    <div class="field">
      <label>活动量</label>
      <select id="activity">
        <option value="1.2">久坐（几乎不运动）</option>
        <option value="1.375">轻度（每周运动 1-3 次）</option>
        <option value="1.55" selected>中度（每周运动 3-5 次）</option>
        <option value="1.725">高度（每周运动 6-7 次）</option>
        <option value="1.9">极高（体力劳动 / 专业训练）</option>
      </select>
    </div>
    <button onclick="calc()">计算</button>
    <div class="result" id="result">
      <div class="result-box">
        <div class="label">基础代谢 BMR（躺着不动一天消耗）</div>
        <div class="num" id="bmr">-</div>
      </div>
      <div class="result-box">
        <div class="label">每日总消耗 TDEE（维持体重）</div>
        <div class="num" id="tdee">-</div>
      </div>
      <div class="result-box">
        <div class="label">减脂期建议摄入（-500 kcal）</div>
        <div class="num" id="cut">-</div>
      </div>
      <div class="result-box">
        <div class="label">增肌期建议摄入（+300 kcal）</div>
        <div class="num" id="bulk">-</div>
      </div>
    </div>
  </div>
</div>
<script>
function calc() {
  const sex = document.getElementById('sex').value;
  const age = parseFloat(document.getElementById('age').value);
  const h = parseFloat(document.getElementById('height').value);
  const w = parseFloat(document.getElementById('weight').value);
  const act = parseFloat(document.getElementById('activity').value);
  if (!age || !h || !w) return alert('请填完整');
  // Mifflin-St Jeor
  let bmr = 10 * w + 6.25 * h - 5 * age + (sex === 'male' ? 5 : -161);
  const tdee = bmr * act;
  document.getElementById('bmr').textContent = Math.round(bmr) + ' kcal';
  document.getElementById('tdee').textContent = Math.round(tdee) + ' kcal';
  document.getElementById('cut').textContent = Math.round(tdee - 500) + ' kcal';
  document.getElementById('bulk').textContent = Math.round(tdee + 300) + ' kcal';
  document.getElementById('result').classList.add('show');
}
</script>
</body>
</html>
